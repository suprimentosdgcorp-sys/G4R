<style>
  :root{
    --bg:#F4F5F7; --card:#FFFFFF; --line:#E4E7EC; --text:#12141A; --muted:#6B7280;
    --navy:#34426b; --navy-bg:#E8EBF1; --orange:#E08A2C; --orange-bg:#FDF0E1;
    --blue:#5B7FE8; --blue-bg:#EAEEFD; --red:#E15A5A; --red-bg:#FCEAEA;
    --green:#3FA873; --green-bg:#E9F6F0; --purple:#9B7FE8; --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:13.5px; }
  .app{ display:flex; min-height:100vh; }
  .rail{ width:210px; flex-shrink:0; background:var(--card); border-right:1px solid var(--line); padding:18px 0; position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto; }
  .rail .brand{ display:flex; align-items:center; gap:10px; padding:0 18px 18px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .rail .brand .logo{ width:58px; height:32px; border-radius:7px; background:var(--navy); display:flex; align-items:center; justify-content:center; padding:4px; flex-shrink:0; }
  .rail .brand .logo img{ width:100%; height:100%; object-fit:contain; display:block; }
  .rail .brand .name{ font-weight:600; font-size:13px; }
  .rail .brand .sub{ color:var(--muted); font-size:10.5px; }
  .rail nav{ display:flex; flex-direction:column; gap:2px; padding:0 10px; }
  .rail button{ all:unset; cursor:pointer; padding:10px 12px; border-radius:7px; color:var(--muted); font-size:13px; font-weight:500; display:flex; align-items:center; gap:9px; border-left:3px solid transparent; }
  .rail button:hover{ background:#F7F8FA; }
  .rail button.active{ background:var(--navy-bg); color:var(--navy); border-left:3px solid var(--navy); }
  .rail .dot{ width:6px; height:6px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .rail button.active .dot{ background:var(--navy); }
  .rail .foot{ margin-top:24px; padding:14px 18px 0; border-top:1px solid var(--line); color:var(--muted); font-size:10.5px; line-height:1.6; }
  .main{ flex:1; padding:26px 32px 60px; max-width:1260px; }
  h1{ font-size:19px; font-weight:700; margin:0 0 3px; }
  .lede{ color:var(--muted); font-size:12.5px; margin:0 0 18px; }
  .kpi-row{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:14px; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; box-shadow:0 1px 2px rgba(16,24,40,.03); }
  .kpi-click{ cursor:pointer; transition:box-shadow .12s, border-color .12s; }
  .kpi-click:hover{ box-shadow:0 3px 10px rgba(16,24,40,.10); border-color:var(--navy); }
  .gov-click{ cursor:pointer; transition:box-shadow .12s, border-color .12s; }
  .gov-click:hover{ box-shadow:0 3px 10px rgba(16,24,40,.10); border-color:var(--navy); }
  .kpi .top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .kpi .lbl{ font-size:11px; color:var(--muted); font-weight:500; }
  .kpi .icon{ width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .kpi .val{ font-size:24px; font-weight:700; margin-top:8px; }
  .kpi .sub{ font-size:10.5px; color:var(--muted); margin-top:2px; }
  .icon.blue{ background:var(--blue-bg); color:var(--blue); } .icon.red{ background:var(--red-bg); color:var(--red); }
  .icon.green{ background:var(--green-bg); color:var(--green); } .icon.orange{ background:var(--orange-bg); color:var(--orange); }
  .icon.gray{ background:#F1F2F4; color:var(--muted); }
  /* V5 — hero row (Tela 1): 4 métricas-âncora maiores que o resto, pra hierarquia executiva */
  .kpi-hero{ padding:18px 20px; }
  .kpi-hero .lbl{ font-size:12px; }
  .kpi-hero .val{ font-size:32px; margin-top:10px; }
  .kpi-hero .sub{ font-size:11px; margin-top:4px; }
  /* V5 — composição da carteira: substitui os 4 cards de status por uma única barra segmentada + legenda */
  .comp-bar{ display:flex; height:14px; border-radius:7px; overflow:hidden; background:#EEF0F3; margin:12px 0 14px; }
  .comp-seg{ cursor:pointer; transition:opacity .12s; }
  .comp-seg:hover{ opacity:.78; }
  .comp-legend{ display:flex; flex-wrap:wrap; gap:18px 22px; }
  .comp-item{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text); cursor:pointer; }
  .comp-item:hover{ text-decoration:underline; }
  .comp-item .dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .comp-item b{ font-weight:700; }
  .gap-card{ background:#FDF0E1; border:1px dashed var(--orange); border-radius:10px; padding:13px 16px; margin-bottom:18px; font-size:12px; color:#8A5A1C; }
  .gap-card b{ font-weight:700; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .panel{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; box-shadow:0 1px 2px rgba(16,24,40,.03); }
  .panel h3{ font-size:13px; font-weight:600; margin:0 0 3px; }
  details.panel{ padding:0; }
  details.panel > summary{ list-style:none; cursor:pointer; padding:16px 18px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  details.panel > summary h3{ margin:0; }
  details.panel > .details-body{ padding:0 18px 16px; }
  details > summary{ list-style:none; }
  details > summary::-webkit-details-marker{ display:none; }
  details > summary .toggle-ico{ width:20px; height:20px; border-radius:6px; background:#F1F2F4; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; flex-shrink:0; }
  details > summary .toggle-ico.small{ width:16px; height:16px; font-size:12px; border-radius:4px; }
  details[open] > summary .toggle-ico::before{ content:'–'; }
  details:not([open]) > summary .toggle-ico::before{ content:'+'; }
  details > summary:hover .toggle-ico{ background:var(--navy-bg); color:var(--navy); }
  /* Tabela por gestor com drill-down: gestor -> categoria (atrasados/em risco/...) -> projeto */
  .gestor-table{ width:100%; font-size:12px; }
  .gestor-head-row{ display:grid; grid-template-columns:2fr 1fr 1.4fr 1.2fr 1.4fr; gap:8px; padding:0 10px 8px; font-size:10.5px; color:var(--muted); font-weight:500; border-bottom:1px solid var(--line); }
  details.gestor-row{ border-bottom:1px solid var(--line); }
  details.gestor-row:last-child{ border-bottom:none; }
  details.gestor-row > summary{ cursor:pointer; display:grid; grid-template-columns:2fr 1fr 1.4fr 1.2fr 1.4fr; gap:8px; padding:10px; align-items:center; }
  details.gestor-row > summary .gestor-nome{ display:flex; align-items:center; gap:8px; font-weight:500; }
  details.gestor-row .gestor-body{ padding:2px 10px 12px 34px; background:#FAFBFC; }
  details.categoria-row{ margin:3px 0; }
  details.categoria-row > summary{ cursor:pointer; display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted); padding:4px 0; }
  .categoria-lista{ margin:2px 0 6px 23px; padding:0; list-style:none; font-size:11.5px; }
  .categoria-lista li{ padding:3px 0; }
  .categoria-lista a{ color:var(--blue); cursor:pointer; text-decoration:none; }
  .categoria-lista a:hover{ text-decoration:underline; }
  .panel .note{ color:var(--muted); font-size:10.5px; margin-bottom:10px; }
  .chart-box{ height:210px; }
  table{ width:100%; border-collapse:collapse; font-size:12px; }
  th{ text-align:left; color:var(--muted); font-weight:500; font-size:10.5px; padding:8px 10px; border-bottom:1px solid var(--line); }
  td{ padding:9px 10px; border-bottom:1px solid var(--line); }
  tr:last-child td{ border-bottom:none; }
  tr.alert-row{ cursor:pointer; }
  tr.alert-row:hover td{ background:#F7F8FA; }
  /* V5 — visuais grandes (muitas linhas) ficam com altura máxima e rolagem interna, em vez de esticar
     a página inteira — o mouse dentro do visual rola só ele, o resto da tela fica fixo. */
  .scroll-tall{ max-height:420px; overflow-y:auto; overflow-x:auto; }
  .scroll-tall table th{ position:sticky; top:0; background:var(--card); z-index:1; box-shadow:0 1px 0 var(--line); }
  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:12px; font-size:10.5px; font-weight:600; }
  .pill .dot{ width:6px; height:6px; border-radius:50%; }
  .pill.andamento{ background:var(--navy-bg); color:var(--navy); } .pill.andamento .dot{ background:var(--navy); }
  .pill.atraso{ background:var(--red-bg); color:var(--red); } .pill.atraso .dot{ background:var(--red); }
  .pill.concluido{ background:var(--green-bg); color:var(--green); } .pill.concluido .dot{ background:var(--green); }
  .pill.naoiniciado{ background:#F1F2F4; color:var(--muted); } .pill.naoiniciado .dot{ background:var(--muted); }
  .pill.critica{ background:var(--red-bg); color:var(--red); } .pill.alta{ background:var(--orange-bg); color:var(--orange); }
  .pill.media{ background:#F1F2F4; color:var(--muted); }
  .pill.saudavel{ background:var(--green-bg); color:var(--green); } .pill.saudavel .dot{ background:var(--green); }
  .pill.atencao{ background:var(--orange-bg); color:var(--orange); } .pill.atencao .dot{ background:var(--orange); }
  .pill.critico{ background:var(--red-bg); color:var(--red); } .pill.critico .dot{ background:var(--red); }
  .tap-sim{ color:var(--green); font-weight:700; font-size:11.5px; } .tap-nao{ color:var(--red); font-weight:700; font-size:11.5px; }
  .prov-note{ background:#FDF0E1; border:1px dashed var(--orange); border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:11px; color:#8A5A1C; }
  .mut{ color:var(--muted); } .pending{ color:var(--orange); font-size:11px; font-style:italic; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-row .name{ width:150px; font-size:11.5px; color:var(--muted); flex-shrink:0; }
  .bar-track{ flex:1; height:8px; background:#EEF0F3; border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:4px; }
  .bar-row .pct{ width:34px; font-size:11.5px; text-align:right; flex-shrink:0; font-weight:600; }
  .screen{ display:none; } .screen.active{ display:block; }
  .breadcrumb{ color:var(--muted); font-size:12px; margin-bottom:8px; cursor:pointer; }
  .breadcrumb:hover{ color:var(--text); }
  .gov-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .gov-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .gov-card .val{ font-size:26px; font-weight:700; color:var(--orange); }
  .gov-card .lbl{ font-size:11.5px; color:var(--muted); margin-top:4px; }
  .proj-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; flex-wrap:wrap; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .proj-head .meta{ display:flex; gap:26px; flex-wrap:wrap; }
  .proj-head .meta div .l{ font-size:10.5px; color:var(--muted); }
  .proj-head .meta div .v{ font-size:13px; margin-top:2px; font-weight:600; }
  .loading{ padding:60px; text-align:center; color:var(--muted); }
  select, input[type=date]{ background:var(--card); border:1px solid var(--line); color:var(--text); padding:7px 10px; border-radius:7px; font-size:12px; font-family:var(--sans); }
  .filters{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; align-items:flex-end; }
  .fgroup{ display:flex; flex-direction:column; gap:4px; }
  .fgroup label{ font-size:10.5px; color:var(--muted); }
  /* V5 — select, input de texto e input de data dentro dos filtros usam o mesmo estilo, senão o navegador
     desenha cada tipo de campo com altura/borda/fonte diferentes (foi o que deixou o campo de Projeto destoando). */
  .fgroup select, .fgroup input[type="text"], .fgroup input[type="date"]{
    border:1px solid var(--line); border-radius:7px; padding:7px 10px; font-size:12.5px;
    font-family:var(--sans); color:var(--text); background:var(--card); outline:none; height:33px;
  }
  .fgroup input[type="text"]{ min-width:170px; }
  .fgroup select:focus, .fgroup input:focus{ border-color:var(--navy); }
  .fgroup input::placeholder{ color:var(--muted); }
  .clear-btn{ border:1px solid var(--line); background:var(--card); padding:7px 12px; border-radius:7px; font-size:12px; color:var(--muted); cursor:pointer; }
  .filter-gap-note{ background:#FDF0E1; border:1px dashed var(--orange); border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:11px; color:#8A5A1C; }

  /* ===================== V5 — RESPONSIVO (celular) ===================== */
  @media (max-width:760px){
    /* Barra lateral: de coluna fixa de 210px (que sobraria pouquíssimo espaço pra tela num celular) pra uma
       faixa horizontal no topo, com os botões de navegação rolando de lado em vez de empilhados. */
    .app{ flex-direction:column; min-height:auto; }
    .rail{ width:100%; height:auto; position:static; padding:12px 0; border-right:none; border-bottom:1px solid var(--line); }
    .rail .brand{ padding:0 14px 12px; margin-bottom:10px; }
    .rail .foot{ display:none; } /* texto de rodapé (versão/fonte) não cabe bem e não é essencial no celular */
    .rail nav{ flex-direction:row; overflow-x:auto; padding:0 14px 4px; gap:6px; -webkit-overflow-scrolling:touch; }
    .rail button{ white-space:nowrap; flex-shrink:0; border-left:none; border-bottom:3px solid transparent; padding:8px 12px; }
    .rail button.active{ border-left:none; border-bottom:3px solid var(--navy); }

    .main{ padding:16px 16px 40px; max-width:100%; }
    h1{ font-size:17px; }

    /* Grids de card (KPI/governança): de 3-7 colunas fixas pra 2 — os valores em `style=` inline (hero, saúde,
       alertas) têm mais especificidade que classe, por isso o !important aqui, senão o celular ignoraria. */
    .kpi-row, .gov-grid{ grid-template-columns:repeat(2,1fr) !important; gap:10px; }
    .kpi-hero .val{ font-size:26px; }
    .grid2{ grid-template-columns:1fr; }

    /* Cabeçalho do projeto: menos espaço entre os pares rótulo/valor, senão quebra em muitas linhas. */
    .proj-head .meta{ gap:14px 20px; }

    /* Tabela "Visão da carteira por gestor": é uma grade de 5 colunas customizada (não é <table>), então em vez
       de espremer o texto até ficar ilegível, ela ganha uma largura mínima e rola de lado como uma tabela normal. */
    .gestor-table{ overflow-x:auto; }
    .gestor-head-row, details.gestor-row > summary{ min-width:560px; }

    /* Campos de filtro: 2 por linha em vez de 1 (que ocuparia a tela toda) ou N lado a lado (que espremeria). */
    .fgroup input[type="text"]{ min-width:0; }
    .fgroup{ width:calc(50% - 5px); }
    .fgroup select, .fgroup input:not([type="checkbox"]){ width:100%; }
    .clear-btn{ width:100%; }

    .chart-box{ height:230px; }
  }
</style>
</head>

<script>
const CARDS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQDzive4CAtbVpbo7nR24yUX-QYu7GpZzQCtvoBFpfj7OD9jxLgugYgK45J5-deQvoog0fcsf0CN7ov/pub?gid=271555632&single=true&output=csv';
const TAP_CSV_URL   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQDzive4CAtbVpbo7nR24yUX-QYu7GpZzQCtvoBFpfj7OD9jxLgugYgK45J5-deQvoog0fcsf0CN7ov/pub?gid=1825536986&single=true&output=csv';

const SEM_ATUALIZACAO_DIAS = 20;
const VENCIMENTO_IMINENTE_DIAS = 15;
// RN11 — faixa de tolerância do desvio de ritmo, em pontos percentuais (prazo consumido - execução).
// O documento (item 18) pede validação do board; valor abaixo é provisório, herdado da mesma lógica de VENCIMENTO_IMINENTE_DIAS.
const DESVIO_RITMO_LIMITE = 15;
// Boards que aparecem na planilha Dashboard_G4R > Fato_Trello_Cards mas não são projetos do G4R
// (ex.: "Estudos - DNC" é um quadro pessoal de teste) — nunca devem entrar no portfólio.
const BOARDS_EXCLUIDOS = ['Estudos - DNC'];

Chart.defaults.color = '#6B7280';
Chart.defaults.font.family = 'Inter';
Chart.defaults.borderColor = '#E4E7EC';

function parseDate(s){ if(!s) return null; const d = new Date(s); return isNaN(d.getTime()) ? null : d; }
function parseDateBR(s){
  if(!s) return null;
  const m = String(s).trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1]);
}
function diasEntre(a,b){ return Math.round((a-b)/86400000); }
function normLista(l){ return (l||'').toUpperCase().trim(); }
function normBool(v){ return String(v||'').trim().toUpperCase()==='TRUE'; } // sem uso nesta fonte (schema atual não tem booleano Concluido); mantido por segurança
function isConcluido(c){ return normLista(c['Lista (Status)']) === 'CONCLUÍDOS'; }

const FILTROS_PADRAO = { projeto:'', gestor:'', status:'', objetivo:'', tap:'', prazo:'', criticos:false, periodoInicio:'', periodoFim:'', risco:'', flag:'' };
let FILTROS = { ...FILTROS_PADRAO };
let CURRENT_SCREEN = 's1';

// RF14 — drill-down: um card/gráfico do portfólio define um recorte de filtro e manda pra lista filtrada (Tela 3).
// Reseta os demais filtros de propósito (é uma nova pergunta "me mostra só isso", não um AND com o que já estava selecionado).
function filtrarEIr(partial){
  FILTROS = { ...FILTROS_PADRAO, ...partial };
  ativarTela('s3');
}

// "flag" é o mecanismo genérico pra qualquer card clicável que não tem dropdown próprio na barra de filtros —
// em vez de criar um campo booleano novo no FILTROS pra cada card novo, cada um vira uma entrada aqui.
const FLAG_FILTROS = {
  semAtualizacao: { label:'Sem atualização', teste: p=>p.semAtualizacao },
  saudeSaudavel:  { label:'Saúde: Saudável', teste: p=>p.saude.classe==='saudavel' },
  saudeAtencao:   { label:'Saúde: Atenção',  teste: p=>p.saude.classe==='atencao' },
  saudeCritico:   { label:'Saúde: Crítico',  teste: p=>p.saude.classe==='critico' },
  tapSemQuadroAtivo: { label:'TAP sem quadro/estrutura ativa', teste: p=>p.tapExiste && p.total===0 },
  semPrazoFinal:  { label:'Sem prazo final (nem TAP nem tarefa)', teste: p=>!p.tapTerminoDate && !p.dataFimProjeto },
  semResponsavel: { label:'Com tarefas sem responsável', teste: p=>p.semResponsavel },
  semPrazoTarefas:{ label:'Com tarefas sem prazo', teste: p=>p.semPrazo },
  comTarefasAtrasadas: { label:'Com tarefas atrasadas', teste: p=>p.tarefasAtrasadas.length>0 },
  semMeta:        { label:'Sem meta mensurável', teste: p=>p.semMetaMensuravel },
  // RN06 (V5) — TAP existe mas está com campo obrigatório vazio (Gestor e/ou Objetivo Estratégico).
  tapIncompleto:  { label:'TAP com campo obrigatório vazio', teste: p=>p.tapExiste && p.tapCamposFaltantes.length>0 }
};

function aplicarFiltros(lista){
  return lista.filter(p=>{
    // V5 — busca por texto (case-insensitive, substring) em vez de exigir nome exato do dropdown antigo.
    if(FILTROS.projeto && !p.nome.toLowerCase().includes(FILTROS.projeto.trim().toLowerCase())) return false;
    if(FILTROS.gestor && p.gestor!==FILTROS.gestor) return false;
    if(FILTROS.status && p.status!==FILTROS.status) return false;
    if(FILTROS.objetivo){
      const objs = p.objetivoEstrategico ? p.objetivoEstrategico.split(',').map(s=>s.trim()) : [];
      if(!objs.includes(FILTROS.objetivo)) return false;
    }
    if(FILTROS.tap==='com' && !p.tapExiste) return false;
    if(FILTROS.tap==='sem' && p.tapExiste) return false;
    if(FILTROS.prazo==='atraso' && p.status!=='atraso') return false;
    if(FILTROS.prazo==='iminente' && !p.vencimentoIminente) return false;
    if(FILTROS.prazo==='emdia' && (p.status==='atraso' || p.vencimentoIminente)) return false;
    if(FILTROS.criticos && !(p.status==='atraso' || p.semAtualizacao)) return false;
    if(FILTROS.risco==='sim' && !p.emRisco) return false;
    if(FILTROS.risco==='nao' && p.emRisco) return false;
    if(FILTROS.flag && FLAG_FILTROS[FILTROS.flag] && !FLAG_FILTROS[FILTROS.flag].teste(p)) return false;
    if((FILTROS.periodoInicio || FILTROS.periodoFim) && p.tapInicioDate && p.tapTerminoDate){
      if(FILTROS.periodoInicio && p.tapTerminoDate < new Date(FILTROS.periodoInicio)) return false;
      if(FILTROS.periodoFim && p.tapInicioDate > new Date(FILTROS.periodoFim)) return false;
    }
    return true;
  });
}

function renderFiltros(){
  const gestores = [...new Set(PROJETOS.map(p=>p.gestor))].sort();
  const objetivos = [...new Set(PROJETOS.flatMap(p=>p.objetivoEstrategico ? p.objetivoEstrategico.split(',').map(s=>s.trim()) : []))].sort();
  const nomes = PROJETOS.map(p=>p.nome).sort();
  const opt = (val, cur, label) => `<option value="${val}" ${cur===val?'selected':''}>${label}</option>`;

  return `
    <div class="filters">
      <div class="fgroup"><label>Projeto específico</label><input type="text" id="fProjeto" list="fProjetoList" autocomplete="off" placeholder="Digite pra buscar..." value="${FILTROS.projeto}"><datalist id="fProjetoList">${nomes.map(n=>`<option value="${n}">`).join('')}</datalist></div>
      <div class="fgroup"><label>Gestor</label><select id="fGestor"><option value="">Todos</option>${gestores.map(g=>opt(g,FILTROS.gestor,g)).join('')}</select></div>
      <div class="fgroup"><label>Status do projeto</label><select id="fStatus">
        <option value="">Todos</option>
        ${opt('andamento',FILTROS.status,'Em andamento')}
        ${opt('atraso',FILTROS.status,'Em atraso')}
        ${opt('concluido',FILTROS.status,'Concluído (lista)')}
        ${opt('naoiniciado',FILTROS.status,'Não iniciado')}
      </select></div>
      <div class="fgroup"><label>Objetivo estratégico</label><select id="fObjetivo"><option value="">Todos</option>${objetivos.map(o=>opt(o,FILTROS.objetivo,o)).join('')}</select></div>
      <div class="fgroup"><label>Situação do TAP</label><select id="fTap">
        <option value="">Todos</option>
        ${opt('com',FILTROS.tap,'Com TAP')}
        ${opt('sem',FILTROS.tap,'Sem TAP')}
      </select></div>
      <div class="fgroup"><label>Situação de prazo</label><select id="fPrazo">
        <option value="">Todos</option>
        ${opt('atraso',FILTROS.prazo,'Em atraso')}
        ${opt('iminente',FILTROS.prazo,'Vencimento iminente')}
        ${opt('emdia',FILTROS.prazo,'Em dia')}
      </select></div>
      <div class="fgroup"><label>Nível de risco</label><select id="fRisco">
        <option value="">Todos</option>
        ${opt('sim',FILTROS.risco,'Em risco')}
        ${opt('nao',FILTROS.risco,'Sem risco identificado')}
      </select></div>
      <div class="fgroup"><label>Período (TAP início)</label><input type="date" id="fPeriodoInicio" value="${FILTROS.periodoInicio}"></div>
      <div class="fgroup"><label>Período (TAP fim)</label><input type="date" id="fPeriodoFim" value="${FILTROS.periodoFim}"></div>
      <div class="fgroup"><label style="display:flex;align-items:center;gap:6px;white-space:nowrap;"><input type="checkbox" id="fCriticos" ${FILTROS.criticos?'checked':''}/> Somente críticos</label></div>

    </div>

async function fetchCSV(url){

}

// RF12/RN13 — Índice de Aderência à Governança (0-100), pesos "exemplo de peso" da seção 8.4 do documento de requisitos.
// Ainda não validados pelo board/PMO (item 18) — tratar como proposta, não como número final.
const CRITERIOS_GOVERNANCA = [
  { chave:'tap', peso:20, label:'TAP cadastrado', curto:'TAP', ok: p => p.tapExiste },
  { chave:'objetivo', peso:15, label:'Objetivo e meta mensuráveis', curto:'Objetivo', ok: p => !!p.objetivoEstrategico },
  { chave:'indicadores', peso:15, label:'Indicadores cadastrados', curto:'Indicador', ok: p => !p.semMetaMensuravel },
  { chave:'respTarefas', peso:15, label:'Tarefas com responsável', curto:'Resp.', ok: p => !p.semResponsavel },
  { chave:'prazoTarefas', peso:15, label:'Tarefas com prazo', curto:'Prazo tarefa', ok: p => !p.semPrazo },
  { chave:'atualizacao', peso:10, label:'Atualização em dia', curto:'Atualização', ok: p => !p.semAtualizacao },
  { chave:'prazoProjeto', peso:10, label:'Prazo do projeto definido', curto:'Prazo projeto', ok: p => !!p.tapTerminoDate }
];
function calcGovernanca(p){
  const obtido = CRITERIOS_GOVERNANCA.reduce((s,c)=> s + (c.ok(p) ? c.peso : 0), 0);
  return Math.round(obtido); // pesos já somam 100
}
// Mesmo corte de 50/75 usado na Saúde do Projeto, reaproveitado aqui só pra colorir — não é um novo critério.
function govColor(score){ return score>=75 ? 'var(--green)' : score>=50 ? 'var(--orange)' : 'var(--red)'; }

// RF11/RN14 — Saúde do projeto (0-100 -> Saudável/Atenção/Crítico).
// O documento pede considerar prazo, execução, resultado, governança e atualização, "com pesos parametrizáveis",
// mas NÃO dá pesos de exemplo (diferente da governança, seção 8.4) nem faixas de corte — ambos são provisórios aqui.
// "Resultado" fica de fora do cálculo: RF09/RF10 seguem sem indicador estruturado (meta/atual numérico) em nenhum projeto.
const PESOS_SAUDE = { prazo:0.35, execucao:0.30, governanca:0.20, atualizacao:0.15 };
function calcSaude(p, governancaIndice){
  let prazoScore;
  if(p.status==='atraso') prazoScore = 0;
  else if(p.vencimentoIminente) prazoScore = 50;
  else prazoScore = 100;
  const execScore = pct(p.nConcluido, p.total);
  const atualizacaoScore = p.semAtualizacao ? 0 : 100;
  const score = Math.round(
    prazoScore*PESOS_SAUDE.prazo + execScore*PESOS_SAUDE.execucao +
    governancaIndice*PESOS_SAUDE.governanca + atualizacaoScore*PESOS_SAUDE.atualizacao
  );
  let classe, label;
  if(score>=75){ classe='saudavel'; label='Saudável'; }
  else if(score>=50){ classe='atencao'; label='Atenção'; }
  else { classe='critico'; label='Crítico'; }
  return { score, classe, label };
}

function agregarProjetos(cardRows, tapRows){
  const tapByBoard = {};
  tapRows.forEach(r => { if(r['Board']) tapByBoard[r['Board']] = r; });

  const boards = {};
  cardRows.forEach(r => {
    const nome = r['Board'];
    if(!nome) return;
    if(BOARDS_EXCLUIDOS.some(b => b.toLowerCase() === nome.trim().toLowerCase())) return;
    if(!boards[nome]) boards[nome] = [];
    boards[nome].push(r);
  });

  // 8.2 — "Projetos com TAP, mas sem quadro/estrutura operacional ativa": um TAP cujo Board não tem NENHUM
  // card no Trello ficaria completamente invisível no dashboard (Total de Projetos, listas, tudo), porque até
  // aqui todo projeto nascia de uma linha do Trello. Garante que ele apareça mesmo assim, com 0 tarefas.
  tapRows.forEach(r => {
    const nome = r['Board'];
    if(!nome) return;
    if(!boards[nome]) boards[nome] = [];
  });

  const now = new Date();

  return Object.entries(boards).map(([nome, cards]) => {
    const listas = cards.map(c => normLista(c['Lista (Status)']));
    const total = cards.length;
    const nInicio = listas.filter(l=>l==='A INICIAR').length;
    const nAndamento = listas.filter(l=>l==='EM ANDAMENTO').length;
    const nAtraso = listas.filter(l=>l==='ATRASADOS').length;
    const nConcluido = listas.filter(l=>l==='CONCLUÍDOS').length;

    let status;
    if(total===0) status='naoiniciado'; // TAP existe, mas o board não tem nenhum card no Trello ainda
    else if(nAtraso>0) status='atraso';
    else if(nConcluido===total) status='concluido';
    else if(nInicio===total) status='naoiniciado';
    else status='andamento';

    const datasAtividade = cards.map(c=>parseDate(c['Última Atividade'])).filter(Boolean);
    const ultimaAtividade = datasAtividade.length ? new Date(Math.max(...datasAtividade)) : null;
    const diasSemAtualizacao = ultimaAtividade ? diasEntre(now, ultimaAtividade) : null;
    const semAtualizacao = diasSemAtualizacao===null || diasSemAtualizacao > SEM_ATUALIZACAO_DIAS;

    const cardsAtivos = cards.filter(c => !isConcluido(c));
    const semResponsavel = cardsAtivos.some(c => !c['Responsável(is)']);
    const semPrazo = cardsAtivos.some(c => !c['Data Fim']);

    const tarefasAtrasadas = cards.filter(c=>{
      if(isConcluido(c)) return false;
      const d = parseDate(c['Data Fim']);
      return d && d < now;
    });

    const tap = tapByBoard[nome];
    const semTAP = !tap;

    let gestor = tap ? (tap['Gestor']||'').trim() : '';
    if(!gestor){
      const freq = {};
      cardsAtivos.forEach(c => (c['Responsável(is)']||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(n=>freq[n]=(freq[n]||0)+1));
      const top = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
      gestor = top ? top[0] : '';
    }

    const objetivoEstrategico = tap ? (tap['Objetivo Estratégico']||'').trim() : '';
    const semMetaMensuravel = !tap || !(tap['Indicador de Sucesso (texto)']||'').trim();

    // RN06 (V5) — "sem governança = ausência de TAP OU de campos mínimos obrigatórios". Até aqui só checávamos
    // "tem TAP ou não"; o campo a campo faltava. Olha o valor BRUTO do TAP (antes do fallback de `gestor` acima
    // preencher com o responsável mais frequente do Trello) — senão um TAP com Gestor vazio nunca apareceria
    // como incompleto, porque o fallback já teria escondido a lacuna.
    const tapCamposFaltantes = [];
    if(tap){
      if(!(tap['Gestor']||'').trim()) tapCamposFaltantes.push('Gestor');
      if(!(tap['Objetivo Estratégico']||'').trim()) tapCamposFaltantes.push('Objetivo Estratégico');
    }

    const proximosVencimentos = cardsAtivos
      .map(c=>parseDate(c['Data Fim']))
      .filter(d => d && d >= now);
    const proximoPrazo = proximosVencimentos.length ? new Date(Math.min(...proximosVencimentos)) : null;
    const diasParaVencer = proximoPrazo ? diasEntre(proximoPrazo, now) : null;
    const vencimentoIminente = diasParaVencer !== null && diasParaVencer <= VENCIMENTO_IMINENTE_DIAS;

    // RN11 — Desvio de ritmo: prazo consumido (data de início mais antiga -> data de fim mais próxima, entre as tarefas)
    // comparado ao % de execução física.
    const datasInicioTarefas = cards.map(c=>parseDate(c['Data Início'])).filter(Boolean);
    const datasFimTarefas = cards.map(c=>parseDate(c['Data Fim'])).filter(Boolean);
    const dataInicioProjeto = datasInicioTarefas.length ? new Date(Math.min(...datasInicioTarefas)) : null;
    const dataFimProjeto = datasFimTarefas.length ? new Date(Math.max(...datasFimTarefas)) : null;
    let pctPrazoConsumido = null, desvioRitmo = null;
    if(dataInicioProjeto && dataFimProjeto && dataFimProjeto > dataInicioProjeto){
      const duracaoTotal = diasEntre(dataFimProjeto, dataInicioProjeto);
      const decorridos = Math.min(Math.max(diasEntre(now, dataInicioProjeto), 0), duracaoTotal);
      pctPrazoConsumido = Math.round(decorridos/duracaoTotal*100);
      desvioRitmo = pctPrazoConsumido - pct(nConcluido, total); // >0 = prazo avançando mais rápido que a execução
    }

    // "Em risco" = vencimento iminente OU desvio de ritmo além da tolerância (RN11), desde que ainda não esteja
    // atrasado nem concluído. O "OU" é de propósito: pega tanto quem tem tarefa vencendo perto quanto quem tem
    // prazo folgado mas já está muito atrás do ritmo esperado — sem exigir os dois sinais ao mesmo tempo, já que
    // desvioRitmo fica null pra boa parte da carteira (depende de "Data Início" preenchida nas tarefas).
    const emRisco = (vencimentoIminente || (desvioRitmo !== null && desvioRitmo > DESVIO_RITMO_LIMITE))
      && status !== 'atraso' && status !== 'concluido';

    const projBase = {
      nome, cards, total, nInicio, nAndamento, nAtraso, nConcluido, status,
      ultimaAtividade, diasSemAtualizacao, semAtualizacao, semResponsavel, semPrazo,
      tarefasAtrasadas, semTAP, gestor: gestor || '(não informado)', objetivoEstrategico,
      semMetaMensuravel, vencimentoIminente, diasParaVencer, emRisco,
      investimentoEstimado: tap ? (tap['Investimento Estimado (R$)']||'') : '',
      indicadorSucesso: tap ? (tap['Indicador de Sucesso (texto)']||'') : '',
      tapExiste: !!tap,
      tapCamposFaltantes,
      tapInicioDate: tap ? parseDateBR(tap['Data de Início']) : null,
      tapTerminoDate: tap ? parseDateBR(tap['Data de Término']) : null,
      dataInicioProjeto, dataFimProjeto, pctPrazoConsumido, desvioRitmo
    };
    const governancaIndice = calcGovernanca(projBase);
    const saude = calcSaude(projBase, governancaIndice);
    return { ...projBase, governancaIndice, saude };
  });
}

      <table><tr><th></th><th>Projeto</th><th>Gestor</th><th>Tarefas atrasadas</th></tr>
      ${criticos.map(c=>`<tr><td style="color:var(--red)">●</td><td>${c.nome}</td><td class="mut">${c.gestor}</td><td style="color:var(--red);font-weight:600;">${c.tarefasAtrasadas.length}</td></tr>`).join('')}
      </table>
    </div>
  `;
  wireFiltros();
}

function renderTela2(p){
  const total = p.length;
  const semTAP = p.filter(x=>x.semTAP).length;
  const semResponsavel = p.filter(x=>x.semResponsavel).length;
  const semPrazo = p.filter(x=>x.semPrazo).length;
  const semAtualizacao = p.filter(x=>x.semAtualizacao).length;
  const comTarefasAtrasadas = p.filter(x=>x.tarefasAtrasadas.length>0).length;
  const vencimentoIminente = p.filter(x=>x.vencimentoIminente).length;
  const semMeta = p.filter(x=>x.semMetaMensuravel).length;
  // 8.2 — dois cards do documento que faltavam: "sem quadro/estrutura ativa" (TAP existe, mas o board não
  // tem nenhum card no Trello) e "sem prazo final"
  const tapSemQuadroAtivo = p.filter(x=>x.tapExiste && x.total===0).length;
  const semPrazoFinal = p.filter(x=>!x.tapTerminoDate && !x.dataFimProjeto).length;

  // Guarda o projeto inteiro (não só contadores) por gestor — precisa disso pro drill-down de 2º nível
  // (categoria -> lista de projetos daquela categoria).
  const porGestor = {};
  p.forEach(x=>{
    if(!porGestor[x.gestor]) porGestor[x.gestor] = [];
    porGestor[x.gestor].push(x);
  });
  const linhasGestor = Object.entries(porGestor).sort((a,b)=>b[1].length-a[1].length);

  // V5 — "Projetos por objetivo estratégico" e "por gestor" migraram da Tela 1 pra aqui (reforma de layout):
  // são leitura de distribuição/analista, cabem melhor na tela de análise gerencial do que na visão executiva.
  const objCount = {};
  let semTAPCount = 0;
  p.forEach(x=>{
    if(!x.objetivoEstrategico){ semTAPCount++; return; }
    x.objetivoEstrategico.split(',').map(s=>s.trim()).forEach(o=> objCount[o] = (objCount[o]||0)+1);
  });
  const topGestores = linhasGestor.slice(0,8).map(([nome,projs])=>[nome,projs.length]);

  function categoriaHtml(label, lista, extra){
    return `<details class="categoria-row">
      <summary><span class="toggle-ico small"></span><span>${label} (${lista.length})</span></summary>
      <ul class="categoria-lista">
        ${lista.length ? lista.map(pr=>`<li><a onclick="abrirProjeto('${pr.nome.replace(/'/g,"\\'")}')">${pr.nome}</a>${extra ? ` <span class="mut">— ${extra(pr)}</span>` : ''}</li>`).join('') : '<li class="mut">Nenhum projeto</li>'}
      </ul>
    </details>`;
  }

  document.getElementById('mainArea').innerHTML = `
    <h1>Análise gerencial e governança</h1>
    <p class="lede">Trello + TAP — sem dependência de dado financeiro</p>
    ${renderFiltros()}
    <div class="gov-grid">
      <div class="gov-card gov-click" onclick="filtrarEIr({})"><div class="val" style="color:var(--text)">${total}</div><div class="lbl">Total de projetos</div></div>
      <div class="gov-card gov-click" onclick="filtrarEIr({tap:'sem'})"><div class="val" style="color:var(--red)">${semTAP}</div><div class="lbl">Projetos sem TAP</div></div>
      <div class="gov-card gov-click" onclick="filtrarEIr({flag:'tapSemQuadroAtivo'})"><div class="val">${tapSemQuadroAtivo}</div><div class="lbl">Projetos com TAP, mas sem quadro/estrutura operacional ativa</div></div>
      <div class="gov-card gov-click" onclick="filtrarEIr({flag:'semPrazoFinal'})"><div class="val">${semPrazoFinal}</div><div class="lbl">Sem prazo final (nem TAP nem tarefa)</div></div>
      <div class="gov-card gov-click" onclick="filtrarEIr({flag:'semResponsavel'})"><div class="val">${semResponsavel}</div><div class="lbl">Com tarefas sem responsável</div></div>
      <div class="gov-card gov-click" onclick="filtrarEIr({flag:'semPrazoTarefas'})"><div class="val">${semPrazo}</div><div class="lbl">Com tarefas sem prazo</div></div>
      <div class="gov-card gov-click" onclick="filtrarEIr({flag:'semAtualizacao'})"><div class="val">${semAtualizacao}</div><div class="lbl">Sem atualização há ${SEM_ATUALIZACAO_DIAS} dias</div></div>
      <div class="gov-card gov-click" onclick="filtrarEIr({flag:'comTarefasAtrasadas'})"><div class="val">${comTarefasAtrasadas}</div><div class="lbl">Com tarefas atrasadas</div></div>
      <div class="gov-card gov-click" onclick="filtrarEIr({prazo:'iminente'})"><div class="val">${vencimentoIminente}</div><div class="lbl">Vencimento iminente (≤${VENCIMENTO_IMINENTE_DIAS}d)</div></div>
      <div class="gov-card gov-click" onclick="filtrarEIr({flag:'semMeta'})"><div class="val" style="color:var(--red)">${semMeta}</div><div class="lbl">Sem meta mensurável</div></div>
    </div>
    <div class="grid2" style="margin-bottom:14px;">
      <div class="panel"><h3>Projetos por objetivo estratégico</h3><div class="note">TAP — só classifica quem tem TAP (${semTAPCount}/${total} sem TAP). Clique numa fatia pra filtrar.</div><div class="chart-box" style="height:270px;"><canvas id="chartObjetivo"></canvas></div></div>
      <div class="panel"><h3>Projetos por gestor</h3><div class="note">TAP quando existe, senão responsável mais frequente nas tarefas do board. Clique numa barra pra filtrar.</div><div class="chart-box" style="height:270px;"><canvas id="chartGestor"></canvas></div></div>
    </div>
    <details class="panel" style="margin-bottom:14px;">
      <summary><h3>Índice de aderência à governança — por projeto (${total})</h3><span class="toggle-ico"></span></summary>
      <div class="details-body">
        <div class="note">Ordenado do menor pro maior índice, pra destacar primeiro quem precisa de atenção (gestão por exceção, seção 15 do documento). ✓/✗ mostram qual critério pesou no cálculo de cada um. Role dentro da tabela pra ver os demais projetos.</div>
        <div class="scroll-tall" style="overflow-x:auto;">
        <table><tr><th>Projeto</th><th>Gestor</th>${CRITERIOS_GOVERNANCA.map(c=>`<th title="peso ${c.peso}%">${c.curto}</th>`).join('')}<th>Índice</th></tr>
        ${p.slice().sort((a,b)=>a.governancaIndice-b.governancaIndice).map(proj=>`
          <tr>
            <td>${proj.nome}</td>
            <td class="mut">${proj.gestor}</td>
            ${CRITERIOS_GOVERNANCA.map(c=> c.ok(proj)
              ? '<td style="text-align:center;color:var(--green);">✓</td>'
              : '<td style="text-align:center;color:var(--red);">✗</td>').join('')}
            <td style="font-weight:700;color:${govColor(proj.governancaIndice)};">${proj.governancaIndice}</td>
          </tr>`).join('')}
        </table>
        </div>
      </div>
    </details>
    <details class="panel" open>
      <summary><h3>Visão da carteira por gestor</h3><span class="toggle-ico"></span></summary>
      <div class="details-body">
        <div class="note">Objetivo: evidenciar carga da carteira e necessidade de apoio ou rebalanceamento — não é ranking. Clique em "+" pra ver Atrasados/Em risco/Tarefas atrasadas/Sem atualização daquele gestor, e de novo pra ver quais projetos especificamente. Role dentro da lista pra ver os demais gestores.</div>
        <div class="gestor-table">
          <div class="gestor-head-row"><div>Gestor</div><div>Projetos</div><div>% médio execução</div><div>Governança média</div><div>Governança crítica (&lt;50)</div></div>
          <div class="scroll-tall">
          ${linhasGestor.map(([nome,projs])=>{
            const nProjetos = projs.length;
            const execMedio = Math.round(projs.reduce((s,x)=>s+pct(x.nConcluido,x.total),0)/nProjetos);
            const govMedioG = Math.round(projs.reduce((s,x)=>s+x.governancaIndice,0)/nProjetos);
            const govCriticaG = projs.filter(x=>x.governancaIndice<50).length;
            const atrasados = projs.filter(x=>x.status==='atraso');
            const emRiscoList = projs.filter(x=>x.emRisco);
            const comTarefasAtrasadas = projs.filter(x=>x.tarefasAtrasadas.length>0);
            const semAtualizacaoList = projs.filter(x=>x.semAtualizacao);
            return `<details class="gestor-row">
              <summary>
                <div class="gestor-nome"><span class="toggle-ico"></span>${nome}</div>
                <div>${nProjetos}</div>
                <div>${execMedio}%</div>
                <div style="color:${govColor(govMedioG)};font-weight:600;">${govMedioG}</div>
                <div style="${govCriticaG>0?'color:var(--red);font-weight:700;':''}">${govCriticaG}</div>
              </summary>
              <div class="gestor-body">
                ${categoriaHtml('Atrasados', atrasados)}
                ${categoriaHtml('Em risco', emRiscoList)}
                ${categoriaHtml('Tarefas atrasadas', comTarefasAtrasadas, pr=>`${pr.tarefasAtrasadas.length} tarefa(s)`)}
                ${categoriaHtml('Sem atualização', semAtualizacaoList, pr=> pr.diasSemAtualizacao!==null ? `${pr.diasSemAtualizacao}d` : 'sem registro')}
              </div>
            </details>`;
          }).join('')}
          </div>
        </div>
      </div>
    </details>
  `;

  destroyCharts();
  const objLabels = Object.keys(objCount);
  const objValues = Object.values(objCount);
  // V5 — mesmo ajuste de cor do resto do painel: laranja/vermelho ficam reservados pra atenção/crítico, então
  // saem da paleta das categorias reais (que são neutras, sem significado de risco); a fatia "Sem TAP / não
  // classificado" é uma lacuna (mesmo conceito de "Projetos sem TAP", que já é vermelho no card de governança)
  // mas aqui, num gráfico de distribuição, o padrão do painel pra "não classificado/neutro" é o cinza (mesmo
  // tom já usado em "Não iniciado" na barra de composição da Tela 1) — fixo, não depende da posição na lista.
  const OBJ_PALETTE = ['#34426b','#5B7FE8','#3FA873','#9B7FE8','#7FB3E8','#6FA88F','#B98FE8','#4F6A99'];
  charts.objetivo = new Chart(document.getElementById('chartObjetivo'), {
    type:'doughnut',
    data:{ labels:[...objLabels, 'Sem TAP / não classificado'],
      datasets:[{ data:[...objValues, semTAPCount], backgroundColor:[...objLabels.map((_,i)=>OBJ_PALETTE[i % OBJ_PALETTE.length]), '#B8BEC9'] }]},
    options:{
      // V5 — legenda embaixo em vez de à direita: com muitos objetivos e nomes longos, "à direita" cortava o
      // texto na coluna estreita do grid2 (ver print do usuário); embaixo, a legenda usa a largura toda do painel.
      plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:10,font:{size:9.5}}}},
      // V5 — clicável: fatia de objetivo filtra por FILTROS.objetivo; a última fatia ("Sem TAP / não
      // classificado") é a mesma proxy usada pra contá-la (objetivoEstrategico vazio == sem TAP), então cai no filtro "tap:sem".
      onClick:(evt,elements)=>{
        if(!elements.length) return;
        const idx = elements[0].index;
        if(idx < objLabels.length) filtrarEIr({objetivo: objLabels[idx]});
        else filtrarEIr({tap:'sem'});
      },
      onHover:(evt,elements)=>{ evt.native.target.style.cursor = elements.length ? 'pointer' : 'default'; }
    }
  });
  charts.gestor = new Chart(document.getElementById('chartGestor'), {
    type:'bar',
    data:{ labels: topGestores.map(g=>g[0]), datasets:[{ data: topGestores.map(g=>g[1]), backgroundColor:'#34426b', borderRadius:4 }]},
    options:{
      plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false}},y:{grid:{color:'#EEF0F3'}}},
      onClick:(evt,elements)=>{
        if(!elements.length) return;
        filtrarEIr({gestor: topGestores[elements[0].index][0]});
      },
      onHover:(evt,elements)=>{ evt.native.target.style.cursor = elements.length ? 'pointer' : 'default'; }
    }
  });
  wireFiltros();
}

function renderTela3(p, cardIdParam){
  if(cardIdParam){
    const proj = p.find(x=>x.nome === cardIdParam);
    if(proj) return renderDetalhe(proj);
  }
  // RF14 — os filtros de drill-down que ainda não têm dropdown próprio (qualquer FLAG_FILTROS) mostram aqui
  // qual veio de um clique em card, pra não sumir sem explicação (limpa junto com "Limpar filtros").
  // "Nível de risco" não entra mais aqui: já tem select próprio na barra de filtros.
  const filtroOrigemCard = [];
  if(FILTROS.flag && FLAG_FILTROS[FILTROS.flag]) filtroOrigemCard.push(FLAG_FILTROS[FILTROS.flag].label);
  document.getElementById('mainArea').innerHTML = `
    <h1>Detalhamento do projeto</h1>
    <p class="lede">${p.length} de ${PROJETOS.length} projetos no filtro atual — clique em um para ver o detalhamento</p>
    ${filtroOrigemCard.length ? `<div class="filter-gap-note" style="background:var(--blue-bg);border-color:var(--blue);color:var(--blue);"><b>Filtro do card clicado:</b> ${filtroOrigemCard.join(', ')} — use "Limpar filtros" pra remover.</div>` : ''}
    ${renderFiltros()}
    <div class="panel"><div class="scroll-tall"><table id="projTable"><tr><th>Projeto</th><th>Gestor</th><th>Status</th><th>Tarefas</th><th>TAP</th></tr></table></div></div>
  `;
  wireFiltros();
  const tbl = document.getElementById('projTable');
  p.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(proj=>{
    const tr = document.createElement('tr');
    const tapLabel = proj.tapExiste ? '<span class="tap-sim">SIM</span>' : '<span class="tap-nao">NÃO</span>';
    const statusLabel = {andamento:'Em andamento', atraso:'Em atraso', concluido:'Concluído (lista)', naoiniciado:'Não iniciado'}[proj.status];
    tr.innerHTML = `<td style="cursor:pointer;color:var(--blue);font-weight:500;" data-nome="${proj.nome}">${proj.nome}</td><td>${proj.gestor}</td><td><span class="pill ${proj.status}"><span class="dot"></span>${statusLabel}</span></td><td>${proj.nConcluido}/${proj.total}</td><td>${tapLabel}</td>`;
    tr.querySelector('td').addEventListener('click', ()=>renderDetalhe(proj));
    tbl.appendChild(tr);
  });
}

function renderDetalhe(proj){
  const statusLabel = {andamento:'Em andamento', atraso:'Em atraso', concluido:'Concluído (lista)', naoiniciado:'Não iniciado'}[proj.status];
  const evolPct = pct(proj.nConcluido, proj.total);
  // RF05 (V5) — "detalhar projeto" pede alertas dentro da própria tela, não só na Central de Alertas geral.
  // Reaproveita a mesma geração de alertas, só que escopada a este projeto.
  const alertasProjeto = gerarAlertas([proj]).sort((a,b)=> ORDEM_CRITICIDADE[a.criticidade]-ORDEM_CRITICIDADE[b.criticidade]);

  document.getElementById('mainArea').innerHTML = `
    <div class="breadcrumb" id="voltarPortfolio">← Voltar ao portfólio</div>

      <div class="meta">

        <div><div class="l">Data de término (TAP)</div><div class="v">${proj.tapTerminoDate ? proj.tapTerminoDate.toLocaleDateString('pt-BR') : '<span class="pending">A definir</span>'}</div></div>
        <div><div class="l">Última atividade</div><div class="v">${proj.ultimaAtividade ? proj.ultimaAtividade.toLocaleDateString('pt-BR') : '—'}</div></div>
        <div><div class="l">Índice de governança</div><div class="v">${proj.governancaIndice}/100</div></div>
        <div><div class="l">Status</div><span class="pill ${proj.status}"><span class="dot"></span>${statusLabel}</span></div>
        <div><div class="l">Saúde do projeto</div><span class="pill ${proj.saude.classe}"><span class="dot"></span>${proj.saude.label} (${proj.saude.score})</span></div>
      </div>
    </div>
    <div class="prov-note"><b>Sobre Governança e Saúde:</b> índice de governança usa os pesos "exemplo" do documento (seção 8.4); saúde do projeto usa uma fórmula provisória (prazo 35% + execução 30% + governança 20% + atualização 15%) que exclui "resultado" — RF09/RF10 ainda não têm meta/atual numérico em nenhum projeto. Nenhum dos dois foi validado pelo board/PMO (item 18 do documento).</div>
    <div class="grid2">
      <div class="panel">
        <h3>Evolução física</h3>

        <div style="display:flex;align-items:center;gap:18px;">
          <div style="height:140px;width:140px;flex-shrink:0;"><canvas id="chartEvol"></canvas></div>
          <div><div style="font-size:22px;font-weight:700;color:var(--navy);">${evolPct}%</div><div style="font-size:11.5px;color:var(--muted);">de execução física</div></div>
        </div>
      </div>
      <div class="panel">
        <h3>Indicador de sucesso (TAP)</h3>
        <div class="note">${proj.tapExiste ? 'Texto bruto do TAP — não estruturado em meta/atual numérico' : 'Projeto sem TAP — sem indicador cadastrado'}</div>
        <div style="font-size:12px;line-height:1.5;">${proj.indicadorSucesso || '<span class="pending">Sem indicador cadastrado</span>'}</div>
        ${proj.investimentoEstimado ? `<div style="margin-top:10px;font-size:12px;"><b>Investimento estimado:</b> R$ ${proj.investimentoEstimado}</div>` : ''}

    </div>
    <div class="panel" style="margin-bottom:14px;">

        <div style="font-size:12px;margin-top:4px;">

        <div class="scroll-tall">
        <table><tr><th>Criticidade</th><th>Tipo de alerta</th><th>Detalhe</th><th>Tarefa</th><th>Ação necessária</th></tr>
        ${alertasProjeto.map(a=>`<tr><td><span class="pill ${a.criticidade==='critica'?'critica':a.criticidade==='alta'?'alta':'media'}"><span class="dot"></span>${a.criticidade==='critica'?'Crítica':a.criticidade==='alta'?'Alta':'Média'}</span></td><td>${a.tipo}</td><td>${a.detalhe}</td><td class="mut">${a.tarefa}</td><td class="mut">${ACAO_POR_TIPO[a.tipo]||'—'}</td></tr>`).join('')}
        </table>
        </div>
      ` : `<div class="note" style="margin-bottom:0;color:var(--green);">✓ Nenhum alerta ativo para este projeto no momento.</div>`}
    </div>
  `;
  document.getElementById('voltarPortfolio').addEventListener('click', ()=>ativarTela('s3'));
  new Chart(document.getElementById('chartEvol'), {
    type:'doughnut',
    data:{ labels:['Concluídas','Restantes'], datasets:[{ data:[evolPct,100-evolPct], backgroundColor:['#34426b','#EEF0F3'], borderWidth:0 }]},
    options:{ cutout:'72%', plugins:{legend:{display:false}} }
  });
}

// 10.1 — "Ação esperada" por tipo de alerta, texto literal do documento
const ACAO_POR_TIPO = {
  'Projeto com tarefas vencidas': 'Replanejar ou concluir formalmente.',
  'Vencimento iminente': 'Revisar pendências e plano de fechamento.',
  'Sem atualização': 'Cobrar atualização/checkpoint.',
  'Tarefa atrasada': 'Definir ação corretiva.',
  'Tarefa sem responsável': 'Atribuir responsável.',
  'Tarefa sem prazo': 'Definir prazo.',
  'Sem TAP': 'Formalizar TAP.',
  'TAP incompleto': 'Completar cadastro do TAP.',
  'Sem meta mensurável': 'Revisar TAP.',
  'Desvio de ritmo': 'Replanejar antes do atraso.'
};
const ORDEM_CRITICIDADE = { critica:0, alta:1, media:2 };

// V5 — geração de alertas extraída pra função própria (antes vivia só dentro de renderTela4), pra poder
// reaproveitar tanto na Central de Alertas (todos os projetos) quanto no painel de alertas do próprio projeto
// no Detalhamento (RF05 — "detalhar projeto" pede alertas ali, não só na Central geral).
function gerarAlertas(projetos){
  const alertas = [];
  projetos.forEach(proj=>{
    if(proj.status==='atraso'){
      alertas.push({ criticidade:'critica', projeto:proj.nome, gestor:proj.gestor, tarefa:'—', tipo:'Projeto com tarefas vencidas', detalhe:`${proj.tarefasAtrasadas.length} tarefa(s) atrasada(s)` });
    }
    if(proj.vencimentoIminente){
      alertas.push({ criticidade:'alta', projeto:proj.nome, gestor:proj.gestor, tarefa:'—', tipo:'Vencimento iminente', detalhe:`${proj.diasParaVencer} dia(s)` });
    }
    if(proj.semAtualizacao){
      alertas.push({ criticidade:'alta', projeto:proj.nome, gestor:proj.gestor, tarefa:'—', tipo:'Sem atualização', detalhe: proj.diasSemAtualizacao!==null ? `${proj.diasSemAtualizacao} dias` : 'sem registro' });
    }
    // RN11 — desvio de ritmo além da faixa de tolerância (documento, seção 10.1: criticidade Alta)
    if(proj.desvioRitmo !== null && proj.desvioRitmo > DESVIO_RITMO_LIMITE){
      alertas.push({ criticidade:'alta', projeto:proj.nome, gestor:proj.gestor, tarefa:'—', tipo:'Desvio de ritmo', detalhe:`${proj.desvioRitmo} p.p. acima da execução` });
    }
    if(proj.semTAP){
      // Corrigido: o documento (seção 10.1) pede criticidade Alta para "Projeto sem TAP", não Média.
      alertas.push({ criticidade:'alta', projeto:proj.nome, gestor:proj.gestor, tarefa:'—', tipo:'Sem TAP', detalhe:'TAP não encontrado nos anexos' });
    } else {
      // RN06 (V5) — "sem governança" também inclui TAP existente com campo obrigatório vazio, não só ausência de TAP.
      if(proj.tapCamposFaltantes.length>0){
        alertas.push({ criticidade:'media', projeto:proj.nome, gestor:proj.gestor, tarefa:'—', tipo:'TAP incompleto', detalhe:`Campo(s) vazio(s): ${proj.tapCamposFaltantes.join(', ')}` });
      }
      if(proj.semMetaMensuravel){
        alertas.push({ criticidade:'media', projeto:proj.nome, gestor:proj.gestor, tarefa:'—', tipo:'Sem meta mensurável', detalhe:'TAP sem indicador de sucesso preenchido' });
      }
    }
    // RF13/RF08 — alertas individuais por tarefa (antes só existiam agregados como semResponsavel/semPrazo por projeto)
    proj.cards.forEach(c=>{
      if(isConcluido(c)) return;
      const tarefaNome = c['Projeto/Tarefa'] || '(sem nome)';
      const dPrazo = parseDate(c['Data Fim']);
      if(dPrazo && dPrazo < new Date()){
        alertas.push({ criticidade:'alta', projeto:proj.nome, gestor:proj.gestor, tarefa:tarefaNome, tipo:'Tarefa atrasada', detalhe:`${diasEntre(new Date(), dPrazo)} dia(s) de atraso` });
      }
      if(!c['Responsável(is)']){
        alertas.push({ criticidade:'media', projeto:proj.nome, gestor:proj.gestor, tarefa:tarefaNome, tipo:'Tarefa sem responsável', detalhe:'Responsável não atribuído' });
      }
      if(!c['Data Fim']){
        alertas.push({ criticidade:'media', projeto:proj.nome, gestor:proj.gestor, tarefa:tarefaNome, tipo:'Tarefa sem prazo', detalhe:'Sem data final definida' });
      }
    });
  });
  return alertas;
}

function renderTela4(p){
  const alertas = gerarAlertas(p);
  alertas.sort((a,b)=> ORDEM_CRITICIDADE[a.criticidade]-ORDEM_CRITICIDADE[b.criticidade]);

  const nCritica = alertas.filter(a=>a.criticidade==='critica').length;
  const nAlta = alertas.filter(a=>a.criticidade==='alta').length;
  const nMedia = alertas.filter(a=>a.criticidade==='media').length;

  document.getElementById('mainArea').innerHTML = `
    <h1>Central de alertas</h1>
    <p class="lede">Gerados a partir de Trello + TAP — sem alerta de orçamento (sem fonte de dado)</p>
    ${renderFiltros()}
    <div class="kpi-row" style="grid-template-columns:repeat(3,1fr);">
      <div class="kpi"><div class="top"><span class="lbl">Alertas críticos</span><span class="icon red">⚠</span></div><div class="val" style="color:var(--red)">${nCritica}</div></div>
      <div class="kpi"><div class="top"><span class="lbl">Alertas altos</span><span class="icon orange">◷</span></div><div class="val" style="color:var(--orange)">${nAlta}</div></div>
      <div class="kpi"><div class="top"><span class="lbl">Alertas médios</span><span class="icon gray">●</span></div><div class="val">${nMedia}</div></div>
    </div>
    <div class="panel">
      <div class="note">Clique numa linha pra abrir o detalhamento do projeto e ver exatamente quais tarefas estão por trás do alerta. Role dentro da tabela pra ver os demais — mostrando todos os ${alertas.length}, dos mais críticos pros médios.</div>
      <div class="scroll-tall">
      <table><tr><th>Criticidade</th><th>Projeto</th><th>Gestor</th><th>Tipo de alerta</th><th>Detalhe</th><th>Tarefa</th><th>Ação necessária</th></tr>
      ${alertas.map(a=>`<tr class="alert-row" onclick="abrirProjeto('${a.projeto.replace(/'/g,"\\'")}')"><td><span class="pill ${a.criticidade==='critica'?'critica':a.criticidade==='alta'?'alta':'media'}"><span class="dot"></span>${a.criticidade==='critica'?'Crítica':a.criticidade==='alta'?'Alta':'Média'}</span></td><td>${a.projeto}</td><td>${a.gestor}</td><td>${a.tipo}</td><td>${a.detalhe}</td><td class="mut">${a.tarefa}</td><td class="mut">${ACAO_POR_TIPO[a.tipo]||'—'}</td></tr>`).join('')}
      </table>
      </div>
    </div>
  `;
  wireFiltros();
}

const RENDERERS = { s1: renderTela1, s2: renderTela2, s3: renderTela3, s4: renderTela4 };

function ativarTela(id){
  CURRENT_SCREEN = id;
  document.querySelectorAll('.rail button').forEach(b=>b.classList.toggle('active', b.dataset.screen===id));
  RENDERERS[id](aplicarFiltros(PROJETOS));
}

// Atalho pra abrir o detalhamento de um projeto direto de qualquer lugar (ex.: lista de projetos dentro do
// drill-down "por gestor" na Tela 2) — usa a busca por nome que renderTela3 já suportava, só nunca era chamada de fora.
function abrirProjeto(nome){
  CURRENT_SCREEN = 's3';
  document.querySelectorAll('.rail button').forEach(b=>b.classList.toggle('active', b.dataset.screen==='s3'));
  renderTela3(PROJETOS, nome);
}

document.querySelectorAll('.rail button').forEach(btn=>{
  btn.addEventListener('click', ()=> ativarTela(btn.dataset.screen));
});

async function init(){
  try{
    const [cardRows, tapRows] = await Promise.all([fetchCSV(CARDS_CSV_URL), fetchCSV(TAP_CSV_URL)]);
    PROJETOS = agregarProjetos(cardRows, tapRows);
    document.getElementById('footInfo').innerText = `Atualizado agora · ${PROJETOS.length} projetos · ${cardRows.length} tarefas`;
    ativarTela('s1');
  } catch(err){
    document.getElementById('mainArea').innerHTML = `<div class="loading">Erro ao carregar os dados: ${err.message}<br><br>Confira se os links CSV publicados ainda estão ativos.</div>`;
  }
}
init();
</script>
